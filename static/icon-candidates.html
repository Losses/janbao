<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>汉堡↔箭头 候选(解析拟合,平头)</title>
<style>
	body { background: #0b0f17; color: #e5e7eb; margin: 0; padding: 28px 20px 60px; font: 14px/1.5 system-ui, sans-serif; }
	h1 { font-size: 18px; margin: 0 0 4px; }
	p.lead { color: #9ca3af; margin: 0 0 18px; max-width: 700px; }
	h2 { font-size: 14px; margin: 22px 0 6px; color: #fbbf24; font-weight: 700; }
	p.desc { color: #9ca3af; margin: 0 0 10px; max-width: 700px; }
	.row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
	.cell { text-align: center; }
	.circle { width: 84px; height: 84px; border-radius: 50%; background: #1f2937; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px #374151; }
	.circle svg { color: #fff; }
	.cap { font-size: 12px; color: #9ca3af; margin-top: 6px; }
	.note { color: #6b7280; font-size: 12px; max-width: 700px; }
	.now { color: #34d399; font-weight: 700; }
	/* material-burger reference (compiled), scaled */
	.ref-wrap { position: relative; width: 60px; height: 60px; transform: scale(0.42); transform-origin: center; }
	.ref-icon { position: absolute; top: 24px; left: 80px; width: 60px; height: 8px; background: #fff; animation: ref-icon 2.8s ease infinite; }
	.ref-icon:before, .ref-icon:after { content: ''; display: inline-block; width: 60px; height: 8px; background: #fff; position: absolute; }
	.ref-icon:before { top: -24px; animation: ref-before 2.8s ease infinite; }
	.ref-icon:after { bottom: -24px; animation: ref-after 2.8s ease infinite; }
	@keyframes ref-before { 0%{width:60px;transform:rotate(0) translate(0,0)} 25%{width:42px;transform:rotate(45deg) translate(27px,-10px)} 50%{width:42px;transform:rotate(45deg) translate(27px,-10px)} 75%{width:60px;transform:rotate(0) translate(0,0)} 100%{width:60px;transform:rotate(0) translate(0,0)} }
	@keyframes ref-after { 0%{width:60px;transform:rotate(0) translate(0,0)} 25%{width:42px;transform:rotate(-45deg) translate(27px,10px)} 50%{width:42px;transform:rotate(-45deg) translate(27px,10px)} 75%{width:60px;transform:rotate(0) translate(0,0)} 100%{width:60px;transform:rotate(0) translate(0,0)} }
	@keyframes ref-icon { 0%{transform:rotate(0)} 25%{transform:rotate(180deg)} 50%{transform:rotate(180deg)} 75%{transform:rotate(360deg)} 100%{transform:rotate(360deg)} }
	.ref-frozen .ref-icon { animation: none; transform: rotate(180deg); }
	.ref-frozen .ref-icon:before { animation: none; width: 42px; transform: rotate(45deg) translate(27px,-10px); }
	.ref-frozen .ref-icon:after { animation: none; width: 42px; transform: rotate(-45deg) translate(27px,10px); }
</style>
</head>
<body>
<h1>汉堡 ↔ 返回箭头:候选(解析拟合,平头)</h1>
<p class="lead">参数已用解析拟合求出(把变换数学对"尖端落在 (4,12)"反解),不再是手调。三版唯一区别是 <b>SPLAY</b>(箭头张开度/空腔大小);三版尖端都精确重合在 (4,12) 并接在茎上。已应用的是 SPLAY=6。挑一个或告诉我往哪调。</p>

<div id="app"></div>

<script>
// Analytically fitted bar morph. TY fixed by the fit; TX, ARM_END derive from SPLAY.
function barMorph(p, SPLAY) {
	const TY = 2.12;
	const TX = (8 - SPLAY / 2 + (5 - SPLAY / 2)) / 0.707 / 2;
	const ARM_END = (SPLAY * 1.414) / 18;
	const stem = `<line x1="3" y1="12" x2="21" y2="12"/>`;
	const top = `<line x1="3" y1="7" x2="21" y2="7" style="transform-box:view-box;transform-origin:12px 7px;transform:rotate(${45*p}deg) translate(${TX*p}px,${-TY*p}px) scaleX(${1-(1-ARM_END)*p})"/>`;
	const bot = `<line x1="3" y1="17" x2="21" y2="17" style="transform-box:view-box;transform-origin:12px 17px;transform:rotate(${-45*p}deg) translate(${TX*p}px,${TY*p}px) scaleX(${1-(1-ARM_END)*p})"/>`;
	return `<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt">
		<g style="transform-box:view-box;transform-origin:12px 12px;transform:rotate(${180*p}deg)">${stem}${top}${bot}</g></svg>`;
}

const VARIANTS = [
	{ splay:6, title:'SPLAY=6(已应用)', desc:'TX=4.95、TY=2.12、arm=0.471。箭头张开 ±6,与 mdiArrowLeft 同比例。空腔最大但箭头最像标准箭头。', now:true },
	{ splay:4.5, title:'SPLAY=4.5', desc:'TX=6.01、TY=2.12、arm=0.354。更紧,空腔更小。', now:false },
	{ splay:4, title:'SPLAY=4', desc:'TX=6.36、TY=2.12、arm=0.314。最紧的小箭头,空腔最小。', now:false }
];

const app = document.getElementById('app');

const refSec = document.createElement('div');
refSec.innerHTML = `<h2>标定:material-burger.sass 原参考</h2>
	<div class="row">
		<div class="cell"><div class="circle"><div class="ref-wrap"><div class="ref-icon"></div></div></div><div class="cap">动画</div></div>
		<div class="cell"><div class="circle"><div class="ref-wrap ref-frozen"><div class="ref-icon"></div></div></div><div class="cap">冻结箭头态</div></div>
	</div>
	<p class="note">原参考是 60px 杆/间距 24(很宽);这里是 MDI(18px/间距 5)。线条箭头的 chevron 开口(所谓"空腔")是 3 杆箭头固有;拟合后它是对称、干净的,尖端精确重合。</p>`;
app.appendChild(refSec);

for (const v of VARIANTS) {
	const sec = document.createElement('div');
	sec.innerHTML = `<h2>${v.now?'<span class="now">'+v.title+'</span>':v.title}</h2><p class="desc">${v.desc}</p>`;
	const row = document.createElement('div');
	row.className = 'row';
	for (const p of [0, 0.5, 1]) {
		const cell = document.createElement('div');
		cell.className = 'cell';
		cell.innerHTML = `<div class="circle">${barMorph(p, v.splay)}</div><div class="cap">p=${p}</div>`;
		row.appendChild(cell);
	}
	sec.appendChild(row);
	app.appendChild(sec);
}
</script>
</body>
</html>
