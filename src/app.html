<!doctype html>
<html lang="en" data-theme="huoxin">
	<head>
		<meta charset="utf-8" />
		<script>
			// Set the user's interface theme before first paint to avoid a FOUC
			// (the default theme flashing before hydration applies the chosen one).
			// The cookie is set server-side in hooks.server.ts; reading it here at
			// parse time sets <html data-theme> before the body is painted.
			//
			// Skip when SSR already resolved the theme for this request (the
			// data-theme-ssr marker, stamped by hooks.server.ts): overwriting it
			// with the interface-theme cookie would flash the interface theme over
			// a per-page theme (e.g. a themed discussion thread). The cookie
			// fallback below only matters for a stale service-worker shell, which
			// has no marker because it was never run through the transform.
			(function () {
				try {
					if (document.documentElement.hasAttribute('data-theme-ssr')) return;
					var m = document.cookie.match(/(?:^|; )theme=([^;]+)/);
					if (m) {
						var t = decodeURIComponent(m[1]);
						if (t) document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#ffb257" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Janbao" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
